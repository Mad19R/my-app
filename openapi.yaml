openapi: 3.0.3
info:
  title: E-Commerce Analytics & Management API
  description: Спецификация API системы управления пользователями и заказами с интеграцией PostgreSQL.
  version: 2.0.0
servers:
  - url: https://my-backend-534k.onrender.com
    description: Production Environment (Render)
paths:
  /users:
    get:
      summary: Список пользователей
      responses:
        "200":
          description: Успешный запрос
    post:
      summary: Создать пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Пользователь создан
        "400":
          description: Ошибка валидации или дубликат Email

  /users/{id}:
    get:
      summary: Получить пользователя по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Данные найдены
        "404":
          description: Пользователь не найден
    put:
      summary: Обновить пользователя
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Данные обновлены
    delete:
      summary: Удалить пользователя
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Пользователь удален

  /orders:
    get:
      summary: Список заказов с деталями (JOIN)
      responses:
        "200":
          description: Список заказов
    post:
      summary: Создать новый заказ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Заказ создан

components:
  schemas:
    # ... Здесь остаются ваши текущие схемы (User, Order и т.д.) ...
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: "Введите секретный ключ: my-secret-key-123"

security:
  - ApiKeyAuth: []