name: Automated API Tests (Newman)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код репозитория
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Устанавливаем Newman (CLI для Postman)
      - name: Install Newman
        run: npm install -g newman

      # 4. Запускаем тесты Postman
      - name: Run Postman Tests via Newman
        run: newman run postman_collection.json